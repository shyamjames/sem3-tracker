<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MCA Semester III — Exam Revision Tracker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <!-- Ambient Noir Atmosphere Overlays -->
  <div class="vignette-overlay" aria-hidden="true"></div>
  <div class="blinds-overlay" aria-hidden="true"></div>

  <!-- Header Navigation -->
  <header class="app-header">
    <div class="nav-inner">
      <a href="{{ url_for('dashboard') }}" class="brand-link">
        <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>MCA REVISION DOSSIER</span>
      </a>
      <div class="nav-meta">
        <span class="brand-badge">Semester III</span>
        <span>Oct 23 &ndash; Nov 6, 2026</span>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container">
    <div class="spotlight-glow" aria-hidden="true"></div>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>MCA Semester III Revision Tracker &bull; 7 Subjects &bull; 133 Syllabus Topics</p>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
