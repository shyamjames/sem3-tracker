<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}MCA Semester III — Exam Revision Tracker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <!-- Ambient Noir Atmosphere Overlays -->
  <div class="vignette-overlay" aria-hidden="true"></div>
  <div class="blinds-overlay" aria-hidden="true"></div>

  <!-- Header Navigation -->
  <header class="app-header">
    <div class="nav-inner">
      <a href="{{ url_for('dashboard') }}" class="brand-link">
        <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>MCA REVISION DOSSIER</span>
      </a>
      <!-- User Auth Section -->
      <div class="nav-auth-wrap" id="nav-auth-wrap">
        <!-- Logged Out State -->
        <button id="btn-login-google" class="btn-auth-google" type="button" aria-label="Sign in with Google">
          <svg class="google-icon" viewBox="0 0 24 24" width="16" height="16">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 12s.7 2.3 1.9 4.7l3.7-1.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.2 7.5 23 12 23z"/>
          </svg>
          <span class="auth-btn-text">Sign in</span>
        </button>

        <!-- Logged In State (Hidden by default) -->
        <div id="user-profile-wrap" class="user-profile-wrap" style="display: none;">
          <img id="user-avatar" class="user-avatar" src="" alt="Avatar" />
          <span id="user-name" class="user-display-name"></span>
          <button id="btn-logout" class="btn-logout-ghost" type="button" title="Sign out">
            <svg class="svg-icon" viewBox="0 0 24 24" width="14" height="14">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="logout-text">Sign out</span>
          </button>
        </div>
      </div>

      <div class="nav-meta">
        <span class="brand-badge">Semester III</span>
        <span class="nav-date-text">Oct 23 &ndash; Nov 6, 2026</span>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container">
    <div class="spotlight-glow" aria-hidden="true"></div>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>MCA Semester III Revision Tracker &bull; 7 Subjects &bull; 133 Syllabus Topics</p>
  </footer>

  <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
