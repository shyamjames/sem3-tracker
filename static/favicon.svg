<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Dark Noir Rounded Base -->
  <rect width="32" height="32" rx="7" fill="#0F0F0F"/>
  <rect x="1" y="1" width="30" height="30" rx="6" stroke="#282828" stroke-width="1.2"/>
  
  <!-- Subtle Venetian Blind Lines -->
  <line x1="2" y1="8" x2="30" y2="8" stroke="#000" stroke-width="1.8" opacity="0.6"/>
  <line x1="2" y1="14" x2="30" y2="14" stroke="#000" stroke-width="1.8" opacity="0.6"/>
  <line x1="2" y1="20" x2="30" y2="20" stroke="#000" stroke-width="1.8" opacity="0.6"/>
  <line x1="2" y1="26" x2="30" y2="26" stroke="#000" stroke-width="1.8" opacity="0.6"/>

  <!-- Confidential Red Accent Tab -->
  <rect x="4" y="21" width="6" height="5" rx="1" fill="#FF2D2D"/>

  <!-- Streetlamp Yellow Magnifying Glass & Checkmark -->
  <!-- Glass Rim -->
  <circle cx="16" cy="14" r="7.5" stroke="#E8C547" stroke-width="2.2" fill="#181818"/>
  <!-- Highlight glint -->
  <path d="M 11 11 A 6 6 0 0 1 18 8" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Verification Checkmark -->
  <path d="M 12.5 14 L 15 16.5 L 19.5 11" fill="none" stroke="#E8C547" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Handle -->
  <line x1="22" y1="20" x2="27" y2="25" stroke="#E8C547" stroke-width="2.4" stroke-linecap="round"/>
</svg>
